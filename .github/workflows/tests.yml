name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Ubuntu / Node 24 / pnpm 11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.8

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # checks JSON, Markdown, YAML and CSS, TypeScript is left out for its Allman braces
      - name: Check formatting
        run: pnpm format:check

      # fails when the notices file is out of date or a package has a license outside allowedLicenses
      - name: Check third-party notices
        run: pnpm notices:check

      - name: Check types
        run: pnpm typecheck

      - name: Build extension
        run: pnpm build

      # unit and integration tests with coverage
      - name: Run Vitest tests
        run: pnpm test:coverage

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
